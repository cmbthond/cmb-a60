<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>CMB — Màn hình lớn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="background.css">
  <link rel="stylesheet" href="orb-design.css">
  <link rel="stylesheet" href="orb-reference.css">
  <link rel="stylesheet" href="countdown-design.css">
  <link rel="stylesheet" href="countdown-ready.css">
  <link rel="stylesheet" href="type-spacing.css">
  <link rel="stylesheet" href="showcase-design.css">
  <link rel="stylesheet" href="showcase-transition.css">
  <link rel="stylesheet" href="hide-screen-text.css">
  <link rel="stylesheet" href="count-scene.css">
  <link rel="stylesheet" href="showcase-clean.css">
  <link rel="stylesheet" href="showcase-stack.css">
  <link rel="stylesheet" href="simple-font.css">
  <style>.full-display{height:100vh;width:100vw;overflow:hidden;background:#031342}</style>
</head>
<body>
  <div id="display" class="full-display"></div>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="socket-client.js"></script>
  <script>
    const c=new BroadcastChannel('cmb-event-control'),d=document.getElementById('display');
    const orb=(active)=>`<div class="display-orb ${active?'spinning':''}"><svg class="orb-svg" viewBox="0 0 200 200" aria-hidden="true"><g class="orbit-track"><circle class="outer-glow" cx="100" cy="100" r="84"/><circle class="outer-solid" cx="100" cy="100" r="84"/><circle class="dash-ring" cx="100" cy="100" r="91"/><circle class="arc" cx="100" cy="100" r="76"/><circle class="inner-ring" cx="100" cy="100" r="63"/><circle class="inner-halo" cx="100" cy="100" r="56"/><circle class="node" cx="100" cy="8" r="4"/><circle class="node" cx="192" cy="100" r="4"/><circle class="node" cx="100" cy="192" r="4"/><circle class="node" cx="8" cy="100" r="4"/></g></svg><span class="orb-label">CMB</span></div>`;
    const slides=[{title:'HỆ SINH THÁI ỨNG DỤNG QUẢN TRỊ',image:'erp.png',label:''},{title:'WEBSITE MỚI',image:'website.png',label:''},{title:'ỨNG DỤNG DI ĐỘNG',image:'mobile.png',label:''}];
    function showcase(index){const slide=slides[index]||slides[0],dots=slides.map((_,i)=>'<i class="'+(i===index?'active':'')+'"></i>').join('');return '<div class="screen app-showcase"><div class="showcase-copy"><p>'+slide.label+'</p><h3>'+slide.title+'</h3></div><div class="product-frame"><img src="'+slide.image+'" alt="'+slide.title+'"></div><div class="showcase-progress">'+dots+'</div></div>'}
    function countdownScene(n){const counter=n>0?'<div class="count-overlay"><b>'+n+'</b></div>':'<div class="count-overlay ready"><b>SẴN SÀNG RA MẮT</b></div>';return '<div class="screen tech-scene count-tech-scene"><div class="screen-bg"></div>'+counter+'<div class="touch-link"></div><div class="orb-row">'+Array.from({length:7},(_,i)=>orb(true)).join('')+'</div></div>'}
    function m(s,a=[],n=10,showcaseIndex=0){
      if(s===3)return showcase(showcaseIndex);
      if(s===2)return countdownScene(n);
      return `<div class="screen tech-scene"><div class="screen-bg"></div><div class="circuit-board"></div><div class="world-map"></div><div class="city-line"></div><div class="digital-wave"></div><div class="floor-grid"></div><div class="display-top">
        <div class="display-title">RA MẮT</div><div class="display-subtitle">HỆ THỐNG ỨNG DỤNG QUẢN TRỊ · ỨNG DỤNG DI ĐỘNG · WEBSITE MỚI</div></div><div class="touch-link"></div><div class="orb-row">${Array.from({length:7},(_,i)=>orb(a.includes(i+1))).join('')}</div></div>`;
    }
    function mount(html,smooth){const old=d.querySelector('.app-showcase');if(!smooth||!old){d.innerHTML=html;return}const holder=document.createElement('div');holder.innerHTML=html;const next=holder.firstElementChild;next.classList.add('showcase-enter');old.classList.add('showcase-exit');d.appendChild(next);setTimeout(()=>old.remove(),720)}
    c.onmessage=e=>{if(e.data?.type==='state'){let p=e.data.payload;mount(m(p.state,p.activeOrbs,p.count,p.showcase),p.state===3)}};
    window.cmbSocket?.on('event-state',p=>mount(m(p.state,p.activeOrbs,p.count,p.showcase),p.state===3));
    c.postMessage({type:'request-state'});
  </script>
</body>
</html>
