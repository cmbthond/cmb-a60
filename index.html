<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>CMB — Màn hình lớn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="background.css">
  <link rel="stylesheet" href="orb-design.css">
  <link rel="stylesheet" href="orb-reference.css">
  <link rel="stylesheet" href="countdown-design.css">
  <link rel="stylesheet" href="countdown-ready.css">
  <link rel="stylesheet" href="type-spacing.css">
  <link rel="stylesheet" href="showcase-design.css">
  <link rel="stylesheet" href="showcase-transition.css">
  <link rel="stylesheet" href="hide-screen-text.css">
  <link rel="stylesheet" href="count-scene.css">
  <link rel="stylesheet" href="showcase-clean.css">
  <link rel="stylesheet" href="showcase-stack.css">
  <link rel="stylesheet" href="simple-font.css">
  <link rel="stylesheet" href="showcase-wow.css">
  <link rel="stylesheet" href="point-editor.css">
  <link rel="stylesheet" href="showcase-overview.css">
  <style>.full-display{height:100vh;width:100vw;overflow:hidden;background:#031342}</style>
</head>
<body>
  <div id="display" class="full-display"></div>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="fireworks.js"></script>
  <script src="socket-client.js"></script>
  <script>
    const c=new BroadcastChannel('cmb-event-control'),d=document.getElementById('display');
    const orb=(active)=>`<div class="display-orb ${active?'spinning':''}"><svg class="orb-svg" viewBox="0 0 200 200" aria-hidden="true"><g class="orbit-track"><circle class="outer-glow" cx="100" cy="100" r="84"/><circle class="outer-solid" cx="100" cy="100" r="84"/><circle class="dash-ring" cx="100" cy="100" r="91"/><circle class="arc" cx="100" cy="100" r="76"/><circle class="inner-ring" cx="100" cy="100" r="63"/><circle class="inner-halo" cx="100" cy="100" r="56"/><circle class="node" cx="100" cy="8" r="4"/><circle class="node" cx="192" cy="100" r="4"/><circle class="node" cx="100" cy="192" r="4"/><circle class="node" cx="8" cy="100" r="4"/></g></svg><span class="orb-label">CMB</span></div>`;
    const defaultPoints=[{id:1,x:8,y:84},{id:2,x:20,y:84},{id:3,x:32,y:84},{id:4,x:44,y:84},{id:5,x:56,y:84},{id:6,x:68,y:84},{id:7,x:80,y:84},{id:8,x:92,y:84}];
    let currentState={state:1,activeOrbs:[],count:10,showcase:0,touchRowY:62,touchPoints:defaultPoints};
    const pointOrb=(point,active)=>orb(active).replace('class="display-orb','data-point-id="'+point.id+'" style="left:'+point.x+'%;top:'+point.y+'%" class="display-orb');
    const slides=[{title:'WEBSITE MỚI',image:'website.png'},{title:'MOBILE APP',image:'mobile.png'},{title:'HỆ THỐNG QUẢN TRỊ',image:'erp.png'},{title:'HỆ SINH THÁI ỨNG DỤNG CMB',overview:true}];
    function showcase(index){const slide=slides[index]||slides[0];if(slide.overview)return '<div class="screen app-showcase"><div class="showcase-copy"><h3>'+slide.title+'</h3></div><div class="apps-overview"><figure><img src="website.png" alt="Website mới"><figcaption>Website mới</figcaption></figure><figure><img src="mobile.png" alt="Mobile App"><figcaption>Mobile App</figcaption></figure><figure><img src="erp.png" alt="Hệ thống quản trị"><figcaption>Hệ thống quản trị</figcaption></figure></div></div>';const dots=slides.map((_,i)=>'<i class="'+(i===index?'active':'')+'"></i>').join('');return '<div class="screen app-showcase"><div class="showcase-copy"><p></p><h3>'+slide.title+'</h3></div><div class="product-frame"><img src="'+slide.image+'" alt="'+slide.title+'"></div><div class="showcase-progress">'+dots+'</div></div>'}
    function countdownScene(n,points,touchRowY){const counter=n>0?'<div class="count-overlay"><b>'+n+'</b></div>':'<div class="count-overlay ready"><b>SẴN SÀNG RA MẮT</b></div>';return '<div class="screen tech-scene count-tech-scene"><div class="screen-bg"></div>'+counter+'<div class="touch-link" style="top:'+touchRowY+'%;bottom:auto"></div><div class="orb-row" style="top:'+touchRowY+'%;bottom:auto;transform:translateY(-50%)">'+points.map((_,i)=>orb(true)).join('')+'</div></div>'}
    function m(s,a=[],n=10,showcaseIndex=0,points=defaultPoints,touchRowY=62){
      if(s===1)return '<div class="screen tech-scene"><div class="screen-bg"></div><div class="touch-link" style="top:'+touchRowY+'%;bottom:auto"></div><div class="orb-row" style="top:'+touchRowY+'%;bottom:auto;transform:translateY(-50%)">'+points.map(point=>orb(a.includes(point.id))).join('')+'</div></div>';
      if(s===3)return showcase(showcaseIndex);
      if(s===2)return countdownScene(n,points,touchRowY);
      if(s===4)return '<div class="screen final-screen"><img src="images/final.png" alt="Man hinh ket thuc"></div>';
      return `<div class="screen tech-scene"><div class="screen-bg"></div><div class="circuit-board"></div><div class="world-map"></div><div class="city-line"></div><div class="digital-wave"></div><div class="floor-grid"></div><div class="display-top">
        <div class="display-title">RA MẮT</div><div class="display-subtitle">HỆ THỐNG ỨNG DỤNG QUẢN TRỊ · ỨNG DỤNG DI ĐỘNG · WEBSITE MỚI</div></div><div class="touch-link"></div><div class="orb-row">${Array.from({length:8},(_,i)=>orb(a.includes(i+1))).join('')}</div></div>`;
    }
    function mount(html,smooth,celebrate=false){const old=d.querySelector('.app-showcase');if(!smooth||!old){d.innerHTML=html;if(celebrate)requestAnimationFrame(()=>window.startFireworks?.(d));else window.stopFireworks?.(d);return}const holder=document.createElement('div');holder.innerHTML=html;const next=holder.firstElementChild;next.classList.add('showcase-enter');old.classList.add('showcase-exit');d.appendChild(next);if(celebrate)requestAnimationFrame(()=>window.startFireworks?.(d));else window.stopFireworks?.(d);setTimeout(()=>old.remove(),720)}
    function showState(p){currentState={...currentState,...p,touchPoints:p.touchPoints||currentState.touchPoints};mount(m(currentState.state,currentState.activeOrbs,currentState.count,currentState.showcase,currentState.touchPoints,currentState.touchRowY),currentState.state===3,currentState.state===3)}
    c.onmessage=e=>{if(e.data?.type==='state')showState(e.data.payload)};
    window.cmbSocket?.on('event-state',showState);
    let draggedPoint=null;
    d.addEventListener('pointerdown',e=>{const orbElement=e.target.closest('[data-point-id]');if(!orbElement)return;draggedPoint=+orbElement.dataset.pointId;d.setPointerCapture?.(e.pointerId);e.preventDefault()});
    d.addEventListener('pointermove',e=>{if(draggedPoint===null)return;const box=d.getBoundingClientRect(),point=currentState.touchPoints.find(item=>item.id===draggedPoint);if(!point)return;point.x=Math.max(4,Math.min(96,(e.clientX-box.left)/box.width*100));point.y=Math.max(8,Math.min(92,(e.clientY-box.top)/box.height*100));const orbElement=d.querySelector('[data-point-id="'+draggedPoint+'"]');if(orbElement){orbElement.style.left=point.x+'%';orbElement.style.top=point.y+'%'}});
    d.addEventListener('pointerup',()=>{if(draggedPoint===null)return;draggedPoint=null;c.postMessage({type:'state',payload:currentState});window.cmbSocket?.emit('event-state',currentState)});
    c.postMessage({type:'request-state'});
  </script>
</body>
</html>
